name: CI

on:
  pull_request:
  workflow_call:  # called by deploy.yml on pushes to main

permissions:
  contents: read

env:
  # OAuth provider secrets aren't needed for tests; the local stack only needs them to be set.
  SUPABASE_AUTH_LINKEDIN_CLIENT_ID: ci
  SUPABASE_AUTH_LINKEDIN_SECRET: ci
  SUPABASE_AUTH_GOOGLE_CLIENT_ID: ci
  SUPABASE_AUTH_GOOGLE_SECRET: ci
  SUPABASE_AUTH_GITHUB_CLIENT_ID: ci
  SUPABASE_AUTH_GITHUB_SECRET: ci

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database:
    name: Migrations + SQL tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db start
      - run: supabase test db

  e2e:
    name: End-to-end (Playwright + local Supabase)
    runs-on: ubuntu-latest
    needs: [app, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor
      - name: Export local Supabase keys
        run: |
          supabase status -o json | jq -r '"NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)\nNEXT_PUBLIC_SUPABASE_ANON_KEY=\(.ANON_KEY)\nSUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"' >> "$GITHUB_ENV"
      - run: npm run test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results, retention-days: 7 }
