name: CI

# Uses GitHub-owned actions only (actions/*), so it runs under an org policy that blocks third-party actions.
# The Supabase CLI is installed from its official release tarball instead of supabase/setup-cli.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # OAuth provider secrets aren't needed for tests; the local stack only needs them to be set.
  SUPABASE_AUTH_LINKEDIN_CLIENT_ID: ci
  SUPABASE_AUTH_LINKEDIN_SECRET: ci
  SUPABASE_AUTH_GOOGLE_CLIENT_ID: ci
  SUPABASE_AUTH_GOOGLE_SECRET: ci
  SUPABASE_AUTH_GITHUB_CLIENT_ID: ci
  SUPABASE_AUTH_GITHUB_SECRET: ci

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit has a Signed-off-by line
        run: |
          missing=$(git log --format='%H %s%n%b%n--END--' ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            | awk '/^[0-9a-f]{40} /{sha=$1; subj=$0; ok=0; next} /^Signed-off-by: /{ok=1} /^--END--$/{if(!ok) print subj}')
          if [ -n "$missing" ]; then
            echo "These commits are missing a DCO sign-off (use git commit -s, see CONTRIBUTING.md):"; echo "$missing"; exit 1
          fi

  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database:
    name: Migrations + SQL tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        run: curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin supabase
      - run: supabase db start
      - run: supabase test db

  e2e:
    name: End-to-end (Playwright + local Supabase)
    runs-on: ubuntu-latest
    needs: [app, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install Supabase CLI
        run: curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin supabase
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor
      - name: Export local Supabase keys
        run: |
          supabase status -o json | jq -r '"NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)\nNEXT_PUBLIC_SUPABASE_ANON_KEY=\(.ANON_KEY)\nSUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"' >> "$GITHUB_ENV"
      - run: npm run test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-traces, path: test-results, retention-days: 7 }
